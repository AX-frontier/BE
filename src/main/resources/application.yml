spring:
  application:
    name: ax-prontier-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ax_prontier}
    username: ${DB_USERNAME:ax_prontier}
    password: ${DB_PASSWORD:ax_prontier}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          create_namespaces: true
    open-in-view: false

server:
  port: 8080

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
    library-path: ${AI_SERVER_LIBRARY_PATH:/library/chat}
    document-review-path: ${AI_SERVER_DOCUMENT_REVIEW_PATH:/document-review/chat}
    timeout-seconds: ${AI_SERVER_TIMEOUT_SECONDS:60}

crawler:
  api:
    trigger-path: ${CRAWLER_API_TRIGGER_PATH:/ingestion/run}
    status-path: ${CRAWLER_API_STATUS_PATH:/ingestion/status/{jobId}}
  schedule:
    cron: ${CRAWLER_SCHEDULE_CRON:-}
    default-sources: ${CRAWLER_DEFAULT_SOURCES:hansung_notice,hsel_library}
    default-since-months: ${CRAWLER_DEFAULT_SINCE_MONTHS:6}
    default-max-pages: ${CRAWLER_DEFAULT_MAX_PAGES:5}
    default-max-notice-pages: ${CRAWLER_DEFAULT_MAX_NOTICE_PAGES:30}
  polling:
    enabled: ${CRAWLER_POLLING_ENABLED:true}
    fixed-delay-ms: ${CRAWLER_POLLING_FIXED_DELAY_MS:60000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
