spring:
  application:
    name: ax-prontier-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ax_prontier}
    username: ${DB_USERNAME:ax_prontier}
    password: ${DB_PASSWORD:ax_prontier}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          create_namespaces: true
    open-in-view: false

server:
  port: 8080

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
    document-review-path: ${AI_SERVER_DOCUMENT_REVIEW_PATH:/document-review/chat}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
