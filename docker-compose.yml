services:
  postgres:
    image: postgres:16-alpine
    container_name: ax-prontier-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ax_prontier
      POSTGRES_USER: ax_prontier
      POSTGRES_PASSWORD: ax_prontier
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
