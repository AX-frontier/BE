services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ax-prontier-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ax_prontier}
      POSTGRES_USER: ${POSTGRES_USER:-ax_prontier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ax_prontier}
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
